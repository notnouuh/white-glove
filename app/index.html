</style></head><body><div id='tb'><b>White Glove</b></div>
<aside><div class="logo">White <i>Glove</i></div><nav id="nav"></nav><button class="ask" onclick="document.body.classList.toggle('chat')">Ask Claude</button></aside>
<main id="main"></main>
<section id="chat"><header>Claude</header><div id="log"></div>
<form onsubmit="return C(this)"><input name="q" placeholder="Log a meal, add an expense, ask anything…" autocomplete="off"><button class="btn">Send</button></form></section>
<script>
const $=s=>document.querySelector(s),K='whiteglove1';
let S={tx:[],hold:[],meals:[],sets:[],goals:{kcal:2800,p:200,c:300,f:80}},tab='overview';
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
const sum=a=>a.reduce((s,x)=>s+x.amt,0),id=()=>Date.now()+Math.random();
const card=(l,v,s='',c='')=>`<div class="card"><div class="l">${ci(l)}${l}</div><div class="v ${c}">${v}</div><div class="s">${s}</div></div>`;
const bar=(p)=>`<div class="bar"><i style="width:${Math.min(100,Math.max(0,p))}%"></i></div>`;
const num=v=>+v||0;
const A={
 tx:d=>S.tx.push({id:id(),date:today(),desc:d.desc,cat:d.cat||'General',amt:Math.abs(num(d.amt)),type:d.type=='in'?'in':'out'}),
 hold:d=>{const t=String(d.ticker).toUpperCase(),h=S.hold.find(x=>x.t==t);if(h){h.sh=num(d.shares);h.cost=num(d.cost);h.px=num(d.price)||h.px}else S.hold.push({id:id(),t,sh:num(d.shares),cost:num(d.cost),px:num(d.price)||num(d.cost)})},
 price:d=>{const h=S.hold.find(x=>x.t==String(d.ticker).toUpperCase());if(h)h.px=num(d.price);return !!h},
 meal:d=>S.meals.push({id:id(),date:today(),name:d.name,k:num(d.k),p:num(d.p),c:num(d.c),f:num(d.f)}),
 set:d=>S.sets.push({id:id(),date:today(),ex:d.ex,w:num(d.w),r:num(d.r)}),
 goals:d=>{S.goals={kcal:num(d.kcal)||S.goals.kcal,p:num(d.p)||S.goals.p,c:num(d.c)||S.goals.c,f:num(d.f)||S.goals.f}}
};
function F(kind,form){const d=Object.fromEntries(new FormData(form));A[kind](d);save();render();return false}
function D(k,i){S[k]=S[k].filter(x=>x.id!=i);save();render()}
const TABS=[['overview','Overview'],['fin','Finances'],['inv','Investments'],['nut','Nutrition'],['lift','Lifting']];
const ph=(t,s)=>`<div class='top'><div><h1>${t}</h1><p class='sub'>${s}</p></div>${AB()}</div>`;
const V={
overview(){const h=new Date().getHours(),m=today().slice(0,7),T=S.tx.filter(x=>x.date.startsWith(m)),inc=sum(T.filter(x=>x.type=='in')),ex=sum(T.filter(x=>x.type=='out'));
 const val=S.hold.reduce((s,x)=>s+x.sh*x.px,0),cost=S.hold.reduce((s,x)=>s+x.sh*x.cost,0),M=S.meals.filter(x=>x.date==today()),k=M.reduce((s,x)=>s+x.k,0),p=M.reduce((s,x)=>s+x.p,0),L=S.sets.filter(x=>x.date==today());
 return ph(`Good ${h<12?'morning':h<18?'afternoon':'evening'}, Noah`,'Your life at a glance.')+`<div class="grid">${card('Net cash flow · this month',$$(inc-ex),`${$$(inc)} in · ${$$(ex)} out`,inc-ex>=0?'good':'bad')}${card('Portfolio value',$$(val),S.hold.length?`${$$(val-cost)} all-time`:'No holdings yet',val-cost>=0?'good':'bad')}${card('Calories today',Math.round(k),`of ${S.goals.kcal}`)}${card('Protein today',Math.round(p)+'g',`of ${S.goals.p}g`)}${card('Sets today',L.length,L.length?L.map(x=>x.ex).filter((v,i,a)=>a.indexOf(v)==i).join(', '):'Rest day?')}</div>
 <h2>Quick start</h2><p class="sub">Use the tabs on the left, or open <b>Ask Claude</b> and say things like “I had 3 eggs and toast, about 450 calories” or “bought VTI, 10 shares at $240”.</p>`},
fin(){const m=today().slice(0,7),T=S.tx.filter(x=>x.date.startsWith(m)),inc=sum(T.filter(x=>x.type=='in')),ex=sum(T.filter(x=>x.type=='out')),c={};
 T.filter(x=>x.type=='out').forEach(x=>c[x.cat]=(c[x.cat]||0)+x.amt);const mx=Math.max(1,...Object.values(c));
 return ph('Finances','Income and spending, tracked month by month.')+`<div class="grid">${card('Income',$$(inc),'this month','good')}${card('Spending',$$(ex),'this month')}${card('Net',$$(inc-ex),'this month',inc-ex>=0?'good':'bad')}${card('Savings rate',inc?Math.round((inc-ex)/inc*100)+'%':'—','of income')}</div>
 <h2>Add transaction</h2><form onsubmit="return F('tx',this)"><select name="type"><option value="out">Expense</option><option value="in">Income</option></select><input name="desc" placeholder="Description" required><input name="cat" placeholder="Category" list="cats"><datalist id="cats"><option>Housing<option>Food<option>Transport<option>Wedding<option>Subscriptions<option>Salary</datalist><input name="amt" type="number" step="any" placeholder="Amount" required><button class="btn">Add</button></form>
 <h2>Spending by category</h2><div class="card">${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span>${bar(v/mx*100)}<span>${$$(v)}</span></div>`).join('')||'<div class="empty">No spending logged this month.</div>'}</div>
 <h2>Recent</h2><div class="wrap"><table>${S.tx.slice(-15).reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.desc)}</td><td>${esc(x.cat)}</td><td class="r ${x.type=='in'?'good':''}">${x.type=='in'?'+':'−'}${$$(x.amt).replace('−','')}</td><td><button class="x" onclick="D('tx',${x.id})">✕</button></td></tr>`).join('')||'<tr><td class="empty">Nothing yet.</td></tr>'}</table></div>`},
inv(){const val=S.hold.reduce((s,x)=>s+x.sh*x.px,0),cost=S.hold.reduce((s,x)=>s+x.sh*x.cost,0),g=val-cost;
 return ph('Investments','Holdings, cost basis and gains. Prices are entered by you or Claude.')+`<div class="grid">${card('Value',$$(val),`${S.hold.length} holdings`)}${card('Cost basis',$$(cost))}${card('Gain / loss',$$(g),cost?(g/cost*100).toFixed(1)+'%':'',g>=0?'good':'bad')}</div>
 <h2>Add or update holding</h2><form onsubmit="return F('hold',this)"><input name="ticker" placeholder="Ticker" required><input name="shares" type="number" step="any" placeholder="Shares" required><input name="cost" type="number" step="any" placeholder="Cost / share" required><input name="price" type="number" step="any" placeholder="Current price"><button class="btn">Save</button></form>
 <h2>Holdings</h2><div class="wrap"><table><tr><th>Ticker</th><th class="r">Shares</th><th class="r">Price</th><th class="r">Value</th><th class="r">Gain</th><th class="r">Weight</th><th></th></tr>${S.hold.map(x=>{const v=x.sh*x.px,gg=v-x.sh*x.cost;return `<tr><td><b>${esc(x.t)}</b></td><td class="r">${x.sh}</td><td class="r">${$$(x.px)}</td><td class="r">${$$(v)}</td><td class="r ${gg>=0?'good':'bad'}">${$$(gg)}</td><td class="r">${val?Math.round(v/val*100):0}%</td><td><button class="x" onclick="D('hold',${x.id})">✕</button></td></tr>`}).join('')||'<tr><td class="empty">No holdings yet.</td></tr>'}</table></div>`},
nut(){const M=S.meals.filter(x=>x.date==today()),t=k=>M.reduce((s,x)=>s+x[k],0),G=S.goals,R=[['Calories','k',G.kcal,''],['Protein','p',G.p,'g'],['Carbs','c',G.c,'g'],['Fat','f',G.f,'g']];
 return ph('Nutrition','Today’s intake against your targets.')+`<div class="card">${R.map(([n,k,g,u])=>`<div class="row"><span>${n}</span>${bar(t(k)/g*100)}<span>${Math.round(t(k))} / ${g}${u}</span></div>`).join('')}</div>
 <h2>Log a meal</h2><form onsubmit="return F('meal',this)"><input name="name" placeholder="Meal" required><input name="k" type="number" placeholder="Calories" required><input name="p" type="number" placeholder="Protein g"><input name="c" type="number" placeholder="Carbs g"><input name="f" type="number" placeholder="Fat g"><button class="btn">Add</button></form>
 <h2>Today</h2><div class="wrap"><table>${M.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.k} kcal</td><td class="r">${x.p}P · ${x.c}C · ${x.f}F</td><td><button class="x" onclick="D('meals',${x.id})">✕</button></td></tr>`).join('')||'<tr><td class="empty">No meals logged today.</td></tr>'}</table></div>
 <h2>Daily targets</h2><form onsubmit="return F('goals',this)"><input name="kcal" type="number" placeholder="Calories (${G.kcal})"><input name="p" type="number" placeholder="Protein (${G.p})"><input name="c" type="number" placeholder="Carbs (${G.c})"><input name="f" type="number" placeholder="Fat (${G.f})"><button class="btn">Update</button></form>`},
lift(){const L=S.sets.filter(x=>x.date==today()),pr={};S.sets.forEach(x=>{const e=x.w*(1+x.r/30),o=pr[x.ex]||(pr[x.ex]={e:0,b:'',vol:0});o.vol+=x.w*x.r;if(e>o.e){o.e=e;o.b=x.w+' × '+x.r}});
 const vol=L.reduce((s,x)=>s+x.w*x.r,0);
 return ph('Lifting','Log sets, watch estimated one‑rep maxes climb.')+`<div class="grid">${card('Sets today',L.length)}${card('Volume today',Math.round(vol).toLocaleString(),'weight × reps')}${card('Exercises tracked',Object.keys(pr).length)}</div>

{const lk=document.createElement('div');lk.id='lock';lk.hidden=true;document.body.append(lk)}
function showLock(){const L=$('#lock'),p=S.profile,lg=`<div class='lg'>White <i>Glove</i></div>`;L.hidden=false;L.innerHTML=p?`<form data-l='in'>${lg}<p>Welcome back, ${esc(p.name)}.</p><input name='pw' type='password' placeholder='Passcode' autocomplete='current-password'><button class='btn'>Unlock</button><div class='err'></div><button type='button' class='lnk' data-reset>Forgot passcode? Reset the app</button></form>`:`<form data-l='new'>${lg}<p>Create your profile</p><input name='name' placeholder='Your name' required><input name='pw' type='password' placeholder='Passcode (4+ characters)' required><input name='pw2' type='password' placeholder='Confirm passcode' required><button class='btn'>Create profile</button><div class='err'></div></form>`;const i=L.querySelector('input');if(i)i.focus()}
function unlock(){$('#lock').hidden=true;$('#lock').innerHTML='';render();if(S.drive){wg.watch(S.drive.path);setTimeout(()=>doSync(true),300)}}
$('#lock').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),er=f.querySelector('.err');
if(f.dataset.l=='new'){if(d.pw.length<4)return er.textContent='Use at least 4 characters.';if(d.pw!=d.pw2)return er.textContent='Passcodes don’t match.';const salt=rs();S.profile={name:d.name.trim(),salt,hash:await hp(d.pw,salt)};save();unlock()}
else{if(await hp(d.pw,S.profile.salt)==S.profile.hash)unlock();else er.textContent='Incorrect passcode.'}});
$('#lock').addEventListener('click',e=>{const a=e.target.closest('[data-reset]');if(!a)return;if(!a.dataset.c){a.dataset.c=1;a.textContent='Click again to erase everything and start over';return}try{localStorage.removeItem(K)}catch(x){}S={tx:[],hold:[],meals:[],sets:[],goals:{kcal:2800,p:200,c:300,f:80}};showLock()});
/* Google Drive sync */
function walk(o,f,d){d=d||0;if(o==null||d>8)return;f(o);if(typeof o=='object')for(const k in o)walk(o[k],f,d+1)}
function skel(o,d){d=d||0;if(typeof o=='string')return o.length>60?o.slice(0,40)+'…('+o.length+' chars)':o;if(Array.isArray(o))return o.slice(0,3).map(x=>skel(x,d+1));if(o&&typeof o=='object'&&d<5){const r={};for(const k in o)r[k]=skel(o[k],d+1);return r}return o}
function setStat(m,c,det){const e=$('#dstat');if(!e)return;e.style.color=c=='bad'?'':'var(--mut)';e.textContent=m;if(det){const p=document.createElement('pre');p.style.cssText='white-space:pre-wrap;font-size:11px;color:var(--mut)';p.textContent=JSON.stringify(det,null,1).slice(0,1500);e.append(p)}}
function errMsg(e){return (e&&e.message)||'Something went wrong.'}


async function pickFile(){try{const f=await wg.pickFile();if(!f)return;S.drive={path:f.path,name:f.name};save();await doSync();wg.watch(f.path)}catch(e){setStat(errMsg(e),'bad')}}
function dropDrive(){['tx','hold','meals','sets'].forEach(k=>S[k]=S[k].filter(x=>x.src!='drive'))}
const nz=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z]/g,''),n2=v=>{const n=parseFloat(String(v).replace(/[$,]/g,''));return isNaN(n)?0:n};
function dOf(v){if(typeof v=='number'&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=String(v||'').trim();if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}/.test(s))return s.slice(0,10);const t=Date.parse(s);return isNaN(t)?today():dstr(new Date(t))}
function ingest(wb){dropDrive();const c={tx:0,hold:0,meals:0,sets:0};
wb.SheetNames.forEach(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}),hi=rows.findIndex(r=>r.filter(x=>x!=='').length>=2);if(hi<0)return;const H=rows[hi].map(nz),col=(...k)=>H.findIndex(h=>k.some(x=>h.includes(x))),body=rows.slice(hi+1).filter(r=>r.some(x=>x!==''));
const ex=col('exercise','lift'),w=col('weight'),rp=col('reps','rep'),tk=col('ticker','symbol'),sh=col('shares','quantity','qty'),kc=col('calorie','kcal'),ml=col('meal','food'),am=col('amount'),ds=col('description','desc','payee','merchant','name'),dt=col('date');
if(ex>=0&&w>=0&&rp>=0)body.forEach(r=>{S.sets.push({id:id(),src:'drive',date:dt>=0?dOf(r[dt]):today(),ex:String(r[ex]),w:n2(r[w]),r:n2(r[rp])});c.sets++});
else if(tk>=0&&sh>=0){const cs=col('cost','basis','avg'),pr=col('price','last','current');body.forEach(r=>{const t=String(r[tk]).toUpperCase().trim();if(!t)return;S.hold.push({id:id(),src:'drive',t,sh:n2(r[sh]),cost:cs>=0?n2(r[cs]):0,px:pr>=0?n2(r[pr]):(cs>=0?n2(r[cs]):0)});c.hold++})}
else if(kc>=0&&(ml>=0||ds>=0)){const p=col('protein'),cb=col('carb'),ft=col('fat');body.forEach(r=>{S.meals.push({id:id(),src:'drive',date:dt>=0?dOf(r[dt]):today(),name:String(r[ml>=0?ml:ds]),k:n2(r[kc]),p:p>=0?n2(r[p]):0,c:cb>=0?n2(r[cb]):0,f:ft>=0?n2(r[ft]):0});c.meals++})}
else if(am>=0&&ds>=0){const ty=col('type'),ct=col('categ');body.forEach(r=>{if(r[am]==='')return;const a=n2(r[am]),y=ty>=0?nz(r[ty]):'',t=ty>=0?(y.startsWith('inc')||y.startsWith('dep')?'in':'out'):(a<0?'out':'in');S.tx.push({id:id(),src:'drive',date:dt>=0?dOf(r[dt]):today(),desc:String(r[ds]),cat:(ct>=0&&String(r[ct]))||'General',amt:Math.abs(a),type:t});c.tx++})}});
return `${c.tx} transactions, ${c.hold} holdings, ${c.meals} meals, ${c.sets} sets`}
async function doSync(quiet){const d=S.drive;if(!d)return;setStat('Syncing…');try{if(!window.XLSX)throw new Error('The spreadsheet reader didn’t load.');const b=await wg.readFile(d.path);if(!b)throw new Error('Couldn’t read that file. Is it still there?');const wb=XLSX.read(b,{type:'base64'});d.sum=ingest(wb);d.at=Date.now();save();render();toast('Synced: '+d.sum)}catch(e){if(quiet)toast(errMsg(e));else setStat(errMsg(e),'bad')}}


function DRV(){const d=S.drive;return `<div class='card' id='drv'><b>Excel workbook</b><p><span class='pill'>${d?'Linked: '+esc(d.name):'Not linked'}</span></p>${d?`<div class='s'>${d.at?'Last synced '+new Date(d.at).toLocaleString()+' · '+esc(d.sum||''):'Not synced yet'}<br>${esc(d.path)}<br>Re-reads automatically whenever the file changes.</div><p><button class='btn' data-g='sync'>Sync now</button><button class='btn' data-g='pick'>Change file</button><button class='lnk' data-g='unlink'>Unlink</button></p>`:`<div class='s'>Pick your Excel file. If it lives in Google Drive, install Google Drive for desktop and choose the file from your Drive folder (usually the G: drive or Google Drive in File Explorer). White Glove then updates itself whenever Drive syncs a change.</div><p><button class='btn' data-g='pick'>Choose Excel file</button></p>`}<div class='err' id='dstat'></div><details class='s'><summary>Expected sheet layout</summary>Any sheet name works; tables are detected by their headers.<br>Transactions: Date, Description, Category, Amount (negative = expense, or add a Type column)<br>Holdings: Ticker, Shares, Cost, Price<br>Meals: Date, Meal, Calories, Protein, Carbs, Fat<br>Lifts: Date, Exercise, Weight, Reps</details></div>`}
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g;if(g=='pick')pickFile();else if(g=='sync')doSync();else if(g=='unlink'){dropDrive();S.drive=null;save();wg.watch(null);render()}});

showLock();
render();

wg.onFileChanged(()=>doSync(true));
let HK=false;wg.hasKey().then(v=>{HK=v});
function AIC(){return `<div class='card'><b>Claude · in-app chat</b><p><span class='pill'>${HK?'Key saved':'No key yet'}</span></p><div class='s'>Chat uses your own Anthropic API key, stored encrypted on this computer. Get one at console.anthropic.com.</div><form data-f='key' style='margin-top:10px'><input name='k' type='password' placeholder='${HK?'Replace API key':'sk-ant-…'}' autocomplete='off'><button class='btn'>Save key</button></form><form data-f='model' style='margin-top:8px'><input name='m' value='${esc(S.model||'claude-sonnet-5-5')}' placeholder='Model'><button class='btn'>Set model</button></form></div>`}
$('#main').addEventListener('submit',async e=>{const f=e.target.dataset.f;if(f!='key'&&f!='model')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 if(f=='key'){const k=(d.k||'').trim();if(!k)return;const r=await wg.setKey(k);HK=!!r;toast(r?'Key saved':'Couldn’t store the key securely on this computer');render()}
 else{S.model=(d.m||'').trim()||'claude-sonnet-5-5';save();toast('Model set')}});
let UV={version:'',url:''};wg.updGet().then(v=>{UV=v});
const UT={checking:'Checking for updates…',current:'You\u2019re on the latest version.',nofeed:'No update source set yet.',dev:'Updates only work in the installed app.',downloading:'Downloading update…',ready:'Update ready. Restart to install.'};
function UPC(){return `<div class='card'><b>App updates</b><p><span class='pill'>Version ${esc(UV.version||'')}</span></p><div class='s' id='ups'>${UV.ready?UT.ready:'White Glove checks for updates automatically and installs them when you close the app.'}</div><form data-f='upd' style='margin-top:10px'><input name='u' value='${esc(UV.url||'')}' placeholder='Update source URL (provided by Claude)'><button class='btn'>Save &amp; check</button></form>${UV.ready?`<p><button class='btn' data-u='go'>Restart to update</button></p>`:''}</div>`}
wg.onUpdate(o=>{if(o.state=='ready'){UV.ready=true;toast('Update ready. Restart from Settings to install.');if(tab=='cfg')render()}const e=$('#ups');if(!e)return;e.textContent=o.state=='error'?'Couldn\u2019t check for updates: '+(o.message||''):(UT[o.state]||'')+(o.version?' ('+o.version+')':'')+(o.pct!=null&&o.state=='downloading'?' '+o.pct+'%':'')});
$('#main').addEventListener('submit',async e=>{if(e.target.dataset.f!='upd')return;e.preventDefault();await wg.updSet(new FormData(e.target).get('u'));UV=await wg.updGet();wg.updCheck()});
$('#main').addEventListener('click',e=>{if(e.target.closest('[data-u=go]'))wg.updInstall()});
/* Claude chat */
const msgs=[],SYS=`You are Claude, the assistant built into "White Glove", Noah’s personal life dashboard (tabs: overview, fin, inv, nut, lift). Use the tools to log data or change things when asked; infer reasonable macros for foods and say your estimates. Answer questions from the data provided. Be brief and warm. If asked to change the app’s design or features, explain what you’d change and that Noah can take that back to the main Claude chat to iterate on the code.`;
function bub(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('#log').append(d);$('#log').scrollTop=1e9;return d}
const T=(name,description,props,fn)=>({name,description,inputSchema:{type:'object',properties:Object.fromEntries(Object.entries(props).map(([k,v])=>[k,{type:v}])),required:Object.keys(props)},execute:i=>{const r=fn(i);save();render();return r||'done'}});
const TOOLS=[
 T('add_transaction','Log income or expense',{description:'string',category:'string',amount:'number',type:'string'},i=>A.tx({desc:i.description,cat:i.category,amt:i.amount,type:i.type})),
 T('save_holding','Add or update an investment holding',{ticker:'string',shares:'number',cost_per_share:'number',price:'number'},i=>A.hold({ticker:i.ticker,shares:i.shares,cost:i.cost_per_share,price:i.price})),
 T('update_price','Update a holding’s current price',{ticker:'string',price:'number'},i=>A.price(i)?'updated':'ticker not found'),
 T('log_meal','Log a meal for today',{name:'string',calories:'number',protein:'number',carbs:'number',fat:'number'},i=>A.meal({name:i.name,k:i.calories,p:i.protein,c:i.carbs,f:i.fat})),
 T('log_set','Log a lifting set',{exercise:'string',weight:'number',reps:'number'},i=>A.set({ex:i.exercise,w:i.weight,r:i.reps})),
 T('set_goals','Set daily macro targets',{calories:'number',protein:'number',carbs:'number',fat:'number'},i=>A.goals({kcal:i.calories,p:i.protein,c:i.carbs,f:i.fat})),
 T('go_to','Open a tab: overview, fin, inv, nut, lift or cfg',{tab:'string'},i=>{if(V[i.tab])tab=i.tab}),
 T('set_widget','Show or hide a dashboard widget by id',{id:'string',visible:'boolean'},i=>{const x=lay().find(w=>w.id==i.id);if(!x)return 'unknown id; valid: '+WD.map(w=>w[0]).join(', ');x.on=!!i.visible})
];
async function C(f){const i=f.elements.q,q=i.value.trim();if(!q)return false;i.value='';msgs.push({role:'user',content:q});bub('user',q);const b=bub('ai','…');
 try{if(!HK){b.textContent='Add your Anthropic API key in Settings → Claude to turn on chat.';return false}
  const data={...S,tx:S.tx.slice(-60),meals:S.meals.slice(-40),sets:S.sets.slice(-80)};delete data.profile;
  const sys=SYS+'\nToday: '+today()+'\nData: '+JSON.stringify(data);
  const h=msgs.slice(-12).map(m=>({role:m.role,content:m.content}));while(h.length&&h[0].role!='user')h.shift();
  const defs=TOOLS.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));let text='';
  for(let n=0;n<6;n++){const r=await wg.ai({model:S.model||'claude-sonnet-5-5',system:sys,messages:h,tools:defs});if(!r.ok)throw new Error(r.error);
   const c=r.data.content||[];text=c.filter(x=>x.type=='text').map(x=>x.text).join('\n')||text;b.textContent=text||'…';
   const tu=c.filter(x=>x.type=='tool_use');if(!tu.length||r.data.stop_reason!='tool_use')break;
   h.push({role:'assistant',content:c});
   h.push({role:'user',content:tu.map(u=>{let o;try{const t=TOOLS.find(x=>x.name==u.name);o=t?String(t.execute(u.input)):'unknown tool'}catch(e){o='error: '+e.message}return {type:'tool_result',tool_use_id:u.id,content:o}})})}
  b.textContent=text||'Done.';msgs.push({role:'assistant',content:text||'Done.'});
 }catch(e){b.textContent='Something went wrong'+(e&&e.message?': '+e.message:'.')}
 $('#log').scrollTop=1e9;return false}
bub('ai','Hi Noah. I can log meals, lifts, spending and holdings for you, or help you find things. Try: “Had a chicken burrito, roughly 700 calories.”');
