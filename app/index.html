/* chat */
.ch{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 18px;border-bottom:1px solid var(--line);font-weight:500;min-height:48px}
#log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.m{white-space:pre-wrap;max-width:92%}.m.user{align-self:flex-end;background:#f0f0f0;border-radius:14px;padding:8px 13px}
.chips{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.chips button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:#3a3a3a}.chips button:hover{background:var(--hover)}
#cf{margin:0 16px 6px;display:flex;align-items:center;gap:8px;border:1px solid #d9d9d9;border-radius:16px;padding:8px 8px 8px 16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
#cf input{flex:1;border:0;padding:6px 0;box-shadow:none!important;background:transparent}
.send{all:unset;cursor:pointer;width:32px;height:32px;border-radius:9px;background:var(--tig);color:#fff;display:grid;place-items:center}
.fine{text-align:center;color:var(--mut);font-size:12px;padding:0 0 12px}
.bdg{position:absolute;top:1px;right:1px;min-width:14px;height:14px;padding:0 3px;box-sizing:border-box;border-radius:7px;background:#3b3a37;color:#fff;font-size:9px;line-height:14px;text-align:center}#np{position:fixed;top:46px;right:150px;width:340px;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:80;padding:6px}#np .ni{padding:9px 10px;border-radius:8px;display:flex;gap:8px}#np .ni:hover{background:var(--hover)}#np .dot{width:7px;height:7px;border-radius:50%;background:#3b3a37;margin-top:6px;flex:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:90}
/* lock */
#lock{position:fixed;top:40px;left:0;right:0;bottom:0;background:var(--bg);z-index:50;display:grid;place-items:center}#lock[hidden]{display:none}
#lock form{display:flex;flex-direction:column;width:310px;padding:28px;gap:12px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(31,30,29,.08)}
#lock .lg{font:500 26px var(--serif)}#lock .lg i{color:var(--ti);font-style:normal}#lock p{margin:0;color:var(--mut)}
.card.gt{background:var(--tb);color:#fff;border:0;border-radius:22px;box-shadow:0 6px 18px -8px var(--tb)}.gt .wt,.gt .s,.gt .v,.gt .v.good,.gt .v.bad,.gt .eye,.gt .ib{color:#fff}.gt .s{opacity:.9}.gt .seg{background:rgba(255,255,255,.22)!important}.gt .seg button{color:rgba(255,255,255,.85)}.gt .seg button.on{background:#fff;color:#2b2a27}.t td.r,.t th.r{font-variant-numeric:tabular-nums}.t td.c,.t th.c{text-align:center}
.mq{overflow:hidden;white-space:nowrap;display:block}.mq>span{display:inline-block}.mq.run>span{animation:mqs var(--t,6s) ease-in-out infinite alternate}@keyframes mqs{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--d))}}
