const msgs=[],SYS=`You are Claude, the assistant built into "White Glove", Noah\u2019s personal life dashboard. Pages: overview, fin (finances), inv (investments), nut (nutrition), lift (lifting), sheets (his linked spreadsheet editor), cfg (settings). Finances are read from his live Google Sheet (use edit_cell to change it). Use the tools to log data, edit spreadsheet cells, and change the dashboard (show/hide widgets, set a widget\u2019s time range or sort). Widget ids: ${ORDER.join(', ')}. The lifting tab is a weekly split planner (use set_split_day); the nutrition tab shows four macro target circles Noah taps when hit each day (use mark_macros_hit). Investments are split into 401k, Roth IRA and Brokerage accounts. Ranges: today, week, month, year, all. Infer reasonable macros for foods and say your estimates. Answer questions from the data provided. Be brief and warm. You cannot change the app\u2019s code or design; if asked, say Noah can request that in his main Claude chat.`;
function bub(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('#log').append(d);$('#log').scrollTop=1e9;return d}
const T=(name,description,props,fn,opt)=>({name,description,inputSchema:{type:'object',properties:Object.fromEntries(Object.entries(props).map(([k,v])=>[k,{type:v}])),required:Object.keys(props).filter(k=>!(opt||[]).includes(k))},execute:i=>{const r=fn(i);save();render();return r==null||r===1?'done':r}});
const entry=id=>lay().find(w=>w.id==id);
const TOOLS=[
 T('save_holding','Add or update an investment holding in an account (401k, roth, or brokerage)',{ticker:'string',shares:'number',cost_per_share:'number',account:'string',price:'number'},i=>A.hold({ticker:i.ticker,shares:i.shares,cost:i.cost_per_share,price:i.price,acct:i.account}),['price','account']),
 T('refresh_prices','Fetch live market prices for all holdings',{},()=>{refreshPx(false);return 'refreshing'}),
 T('update_price','Set a fallback price used only when no live quote is available',{ticker:'string',price:'number'},i=>A.price(i)?'updated':'ticker not found'),
 T('log_meal','Log a meal for today',{name:'string',calories:'number',protein:'number',carbs:'number',fat:'number'},i=>A.meal({name:i.name,k:i.calories,p:i.protein,c:i.carbs,f:i.fat})),
 T('log_set','Log a lifting set',{exercise:'string',weight:'number',reps:'number'},i=>A.set({ex:i.exercise,w:i.weight,r:i.reps})),
 T('set_goals','Set daily macro targets',{calories:'number',protein:'number',carbs:'number',fat:'number'},i=>A.goals({kcal:i.calories,p:i.protein,c:i.carbs,f:i.fat}),['calories','protein','carbs','fat']),
 T('go_to','Open a page: overview, fin, inv, nut, lift, sheets or cfg',{tab:'string'},i=>{if(!V[i.tab])return 'unknown page';go(i.tab)}),
 T('set_widget','Show or hide an overview widget',{id:'string',visible:'boolean'},i=>{const x=entry(i.id);if(!x)return 'unknown id; valid: '+ORDER.join(', ');x.on=!!i.visible}),
 T('widget_range','Set the time range of an overview widget (today, week, month, year, all)',{id:'string',range:'string'},i=>{const x=entry(i.id);if(!x)return 'unknown id';if(!DEF[i.id].rng)return 'that widget has no range';if(!DEF[i.id].rng.includes(i.range))return 'allowed: '+DEF[i.id].rng.join(', ');x.rng=i.range}),
 T('widget_sort','Set the sort order of an overview widget',{id:'string',sort:'string'},i=>{const x=entry(i.id);if(!x)return 'unknown id';const s=DEF[i.id].sort;if(!s)return 'that widget has no sort';if(!s.some(y=>y[0]==i.sort))return 'allowed: '+s.map(y=>y[0]).join(', ');x.sort=i.sort}),
 T('set_split_day','Set a day of the lifting split. day is Mon..Sun, name e.g. Push or Rest, exercises like "Bench Press 4x8 185; Incline DB Press 3x10"',{day:'string',name:'string',exercises:'string'},i=>{const d=DAYS.find(x=>x.toLowerCase()==String(i.day).slice(0,3).toLowerCase());if(!d)return 'day must be Mon..Fri';const D=splitOf()[d];D.name=i.name;if(i.exercises!=null&&String(i.exercises).trim()!=='')D.ex=parseEx(i.exercises);return 'set '+d},['exercises']),
 T('mark_macros_hit','Mark a macro as hit (or not) for today. macro: calories, protein, carbs, fat, or all',{macro:'string',hit:'boolean'},i=>{const m=String(i.macro||'all').toLowerCase(),map={calories:'k',protein:'p',carbs:'c',fat:'f'},ks=m=='all'?['k','p','c','f']:[map[m]].filter(Boolean);if(!ks.length)return 'unknown macro';S.hitsM=S.hitsM||{};const d=today(),h=S.hitsM[d]=S.hitsM[d]||{};ks.forEach(k=>{if(i.hit)h[k]=1;else delete h[k]});if(!Object.keys(h).length)delete S.hitsM[d];return 'marked'}),
 T('read_sheet','Read cells from the linked spreadsheet as tab-separated text',{sheet:'string'},i=>{if(!G.wb)return 'no spreadsheet linked';const n=i.sheet&&G.wb.Sheets[i.sheet]?i.sheet:G.sheet,ws=G.wb.Sheets[n],d=dims(ws);let o='';for(let r=0;r<Math.min(d.r,80);r++){const row=[];for(let c=0;c<d.c;c++)row.push(shown(cellAt(ws,r,c)));o+=row.join('\t')+'\n'}return n+':\n'+o},['sheet']),
 T('edit_cell','Set a cell in the linked spreadsheet (e.g. cell B3, value 42 or =SUM(A1:A5)); saves to the file',{cell:'string',value:'string',sheet:'string'},i=>{if(!G.wb)return 'no spreadsheet linked';const n=i.sheet&&G.wb.Sheets[i.sheet]?i.sheet:G.sheet,ws=G.wb.Sheets[n];let a;try{a=XLSX.utils.decode_cell(String(i.cell).toUpperCase())}catch(e){return 'bad cell'}setCell(ws,a.r,a.c,i.value);recalc(ws);sched();if(tab=='sheets')paintGrid();return 'set '+i.cell},['sheet'])
];
async function C(f){const i=f.elements.q,q=i.value.trim();if(!q)return false;i.value='';qa('.chips').forEach(x=>x.remove());msgs.push({role:'user',content:q});bub('user',q);const b=bub('ai','\u2026');
 try{if(!HK){b.textContent='Add your Anthropic API key in Settings \u2192 Claude to turn on chat.';return false}
  const data={...S,split:S.split,tx:S.tx.slice(-60),meals:S.meals.slice(-40),sets:S.sets.slice(-80),layout:lay().filter(x=>x.on).map(x=>({id:x.id,rng:x.rng,sort:x.sort}))};delete data.profile;
  const sys=SYS+'\nToday: '+today()+(G.wb?'\nLinked sheet: '+(S.gs||S.drive).name+' (tabs: '+G.wb.SheetNames.join(', ')+', open: '+G.sheet+')':'')+'\nData: '+JSON.stringify(data);
  const h=msgs.slice(-12).map(m=>({role:m.role,content:m.content}));while(h.length&&h[0].role!='user')h.shift();
  const defs=TOOLS.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));let text='';
  for(let n=0;n<6;n++){const r=await wg.ai({model:S.model||'claude-sonnet-5-5',system:sys,messages:h,tools:defs});if(!r.ok)throw new Error(r.error);
   const c=r.data.content||[];text=c.filter(x=>x.type=='text').map(x=>x.text).join('\n')||text;b.textContent=text||'\u2026';
   const tu=c.filter(x=>x.type=='tool_use');if(!tu.length||r.data.stop_reason!='tool_use')break;
   h.push({role:'assistant',content:c});
   h.push({role:'user',content:tu.map(u=>{let o;try{const t=TOOLS.find(x=>x.name==u.name);o=t?String(t.execute(u.input)):'unknown tool'}catch(e){o='error: '+e.message}return {type:'tool_result',tool_use_id:u.id,content:o}})})}
  b.textContent=text||'Done.';msgs.push({role:'assistant',content:text||'Done.'});
 }catch(e){b.textContent='Something went wrong'+(e&&e.message?': '+e.message:'.')}
 $('#log').scrollTop=1e9;return false}
{const a=bub('ai','Hi. I can log spending, set your lifting split, mark macro days, edit cells in your spreadsheet, and rearrange your dashboard. Try one of these:'),c=document.createElement('div');c.className='chips';c.innerHTML=['I hit my macros today','Set Monday as Push: bench 4x8, incline DB 3x10','Add $45 for groceries'].map(t=>`<button data-chip>${t}</button>`).join('');a.after(c)}
showLock();render();
</script></body></html>
